<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Schedule Extraction Viewer</title>
<style>
:root{
  --paper:#F4F7F7; --surface:#fff; --surface-2:#EDF2F2;
  --ink:#0F1A1C; --muted:#5B6B6E; --faint:#8A9A9C;
  --rule:#D5DFDF; --rule-strong:#B4C4C4;
  --accent:#0E5C63; --review:#B45309; --ok:#15803D;
  --box-door:#0E5C63; --box-window:#15803D; --box-other:#7A5CC4; --box-block:#B3261E;
  --box-det:#B45309;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --body:system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){
  --paper:#0B1315; --surface:#111E20; --surface-2:#16282B;
  --ink:#E7EFEF; --muted:#94A8A9; --faint:#6E8384;
  --rule:#23393B; --rule-strong:#33504F; --accent:#5FBEC2;
  --box-door:#5FBEC2; --box-window:#5FBE86; --box-other:#B9A2F0; --box-block:#E88A82;
  --box-det:#E0A159;
}}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--body);
  display:grid;grid-template-columns:320px 1fr;overflow:hidden}
aside{border-right:1px solid var(--rule);background:var(--surface);display:flex;flex-direction:column;min-height:0}
.head{padding:14px 16px;border-bottom:1px solid var(--rule)}
h1{font-size:15px;margin:0 0 3px;letter-spacing:.01em}
.sub{font-size:12px;color:var(--muted);margin:0;font-family:var(--mono)}
.filters{padding:10px 16px;border-bottom:1px solid var(--rule);display:flex;flex-direction:column;gap:8px}
input,select{font:inherit;font-size:13px;padding:6px 8px;border:1px solid var(--rule-strong);
  border-radius:3px;background:var(--surface);color:var(--ink);width:100%}
.legend{display:flex;flex-wrap:wrap;gap:8px;font-size:11px;color:var(--muted);font-family:var(--mono)}
.legend i{display:inline-block;width:9px;height:9px;border:2px solid;margin-right:4px;vertical-align:-1px}
.list{overflow-y:auto;flex:1;min-height:0}
.row{padding:9px 16px;border-bottom:1px solid var(--rule);cursor:pointer;font-size:13px}
.row:hover{background:var(--surface-2)}
.row.on{background:var(--surface-2);box-shadow:inset 3px 0 0 var(--accent)}
.row b{display:block;font-weight:600}
.row span{color:var(--muted);font-size:11.5px;font-family:var(--mono)}
main{position:relative;overflow:auto;background:var(--surface-2)}
.stage{position:relative;margin:0 auto;transform-origin:0 0}
.stage img{display:block;width:100%;height:auto}
.ov{position:absolute;border:2px solid;pointer-events:auto;cursor:default}
.ov.block{border-style:dashed;border-color:var(--box-block)}
.ov.item{background:rgba(14,92,99,.06)}
.ov.door{border-color:var(--box-door)}
.ov.window{border-color:var(--box-window)}
.ov.other{border-color:var(--box-other)}
.ov.rev{border-style:dotted}
.ov.det{border-color:var(--box-det);background:rgba(180,83,9,.07)}
.ov.det.out{border-style:dashed;background:none}
.ov.det>.tag{background:var(--box-det)}
.tag{position:absolute;top:-1px;left:-1px;transform:translateY(-100%);
  font:600 10px/1.5 var(--mono);padding:1px 5px;white-space:nowrap;color:#fff;background:var(--box-door)}
.ov.window>.tag{background:var(--box-window)} .ov.other>.tag{background:var(--box-other)}
.ov.block>.tag{background:var(--box-block)}
.bar{position:sticky;top:0;z-index:20;display:flex;gap:14px;align-items:center;
  padding:8px 14px;background:var(--surface);border-bottom:1px solid var(--rule);font-size:13px}
.bar label{display:flex;align-items:center;gap:5px;color:var(--muted);cursor:pointer}
.bar input[type=checkbox]{width:auto}
.bar .z{margin-left:auto;font-family:var(--mono);font-size:12px;color:var(--muted)}
button{font:inherit;font-size:13px;padding:4px 9px;border:1px solid var(--rule-strong);
  background:var(--surface);color:var(--ink);border-radius:3px;cursor:pointer}
button:hover{background:var(--surface-2)}
.tip{position:fixed;z-index:50;max-width:340px;padding:8px 10px;background:var(--surface);
  border:1px solid var(--rule-strong);border-radius:3px;font-size:12px;box-shadow:0 8px 24px -12px rgba(0,0,0,.5);
  pointer-events:none;display:none}
.tip b{font-family:var(--mono)}
.tip .t{color:var(--muted);display:block;margin-top:3px;font-family:var(--mono);font-size:11px}
.empty{padding:40px;text-align:center;color:var(--muted)}
</style>
</head>
<body>
<aside>
  <div class="head">
    <h1>Schedule Extraction Viewer</h1>
    <p class="sub" id="counts">loading…</p>
  </div>
  <div class="filters">
    <input type="search" id="q" placeholder="Filter sheets (project, title)…">
    <div class="legend">
      <span><i style="border-color:var(--box-block)"></i>block</span>
      <span><i style="border-color:var(--box-door)"></i>door</span>
      <span><i style="border-color:var(--box-window)"></i>window</span>
      <span><i style="border-color:var(--box-other)"></i>other</span>
      <span><i style="border-color:var(--box-det)"></i>detections</span>
    </div>
  </div>
  <div class="list" id="list"></div>
</aside>
<main>
  <div class="bar">
    <label><input type="checkbox" id="showBlocks" checked> Blocks</label>
    <label><input type="checkbox" id="showItems" checked> Items</label>
    <label><input type="checkbox" id="showDet" checked> Detections</label>
    <label><input type="checkbox" id="showLabels" checked> Labels</label>
    <button id="zin">+</button><button id="zout">−</button><button id="zfit">Fit</button>
    <span class="z" id="zlabel"></span>
  </div>
  <div id="stageWrap"><div class="empty">Pick a sheet on the left.</div></div>
</main>
<div class="tip" id="tip"></div>
<script>
const $=s=>document.querySelector(s);
let DATA=null, current=null, zoom=1;

const catClass=c=>c==='door'?'door':c==='window'?'window':'other';
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

fetch('index.json').then(r=>r.json()).then(d=>{
  DATA=d;
  const items=d.sheets.reduce((n,s)=>n+s.items.length,0);
  const boxed=d.sheets.reduce((n,s)=>n+s.items.filter(i=>i.rect).length,0);
  const dets=d.sheets.reduce((n,s)=>n+(s.detections||[]).length,0);
  $('#counts').textContent=`${d.sheets.length} sheets · ${items} text items · ${dets} detections`;
  renderList();
  if(d.sheets.length) select(0);
});

function renderList(){
  const q=$('#q').value.trim().toLowerCase();
  const rows=DATA.sheets.map((s,i)=>({s,i}))
    .filter(({s})=>!q || (s.project_id+' '+s.file+' '+s.sheet_name+' '+
        s.blocks.map(b=>b.title).join(' ')).toLowerCase().includes(q));
  $('#list').innerHTML=rows.map(({s,i})=>`
    <div class="row${current===i?' on':''}" data-i="${i}">
      <b>Project ${esc(s.project_id)} · page ${s.page}</b>
      <span>${s.items.length} text · ${(s.detections||[]).length} det · ${s.blocks.length} blocks${s.rotation?' · rot '+s.rotation+'°':''}</span>
      <span>${esc(s.blocks.map(b=>b.title).slice(0,2).join(' / ')||'—')}</span>
    </div>`).join('') || '<div class="empty">No sheets match.</div>';
  $('#list').querySelectorAll('.row').forEach(el=>
    el.onclick=()=>select(+el.dataset.i));
}
$('#q').oninput=renderList;

function select(i){
  current=i; renderList();
  const s=DATA.sheets[i];
  const wrap=$('#stageWrap');
  wrap.innerHTML=`<div class="stage" id="stage" style="width:${s.width}px">
      <img src="${s.image}" alt="Project ${esc(s.project_id)} page ${s.page}">
    </div>`;
  drawBoxes(s);
  fit();
}

function drawBoxes(s){
  const stage=$('#stage'); if(!stage) return;
  stage.querySelectorAll('.ov').forEach(e=>e.remove());
  const labels=$('#showLabels').checked;
  const add=(r,cls,tag,meta)=>{
    if(!r) return;
    const d=document.createElement('div');
    d.className='ov '+cls;
    d.style.cssText=`left:${r[0]}px;top:${r[1]}px;width:${Math.max(2,r[2]-r[0])}px;height:${Math.max(2,r[3]-r[1])}px`;
    if(labels&&tag) d.innerHTML=`<span class="tag">${esc(tag)}</span>`;
    if(meta){ d.onmousemove=e=>showTip(e,meta); d.onmouseleave=hideTip; }
    stage.appendChild(d);
  };
  if($('#showBlocks').checked)
    s.blocks.forEach(b=>add(b.rect,'block',`${b.title} · ${b.genre}`,
      {title:b.title,lines:[`${b.category} · ${b.kind} · ${b.genre}`,b.block_id]}));
  if($('#showDet').checked)
    (s.detections||[]).forEach(d=>add(d.rect,'det'+(d.in_block?'':' out'),
      // Once an opening is linked to its schedule row, its mark and size are
      // far more use on the drawing than the confidence.
      d.size_text?`${d.mark} · ${d.size_text}`:d.confidence.toFixed(2),
      {title:d.mark?`${d.mark} — ${d.size_text||'no size'}`
                   :`detection · ${d.confidence.toFixed(2)}`,lines:[
        d.in_block?`in ${d.block_title}`:'outside any schedule block',
        `category: ${d.category}`,
        d.size_text?`size ${d.size_text}${d.shape_agrees===false?'  (shape differs — pair or sidelites?)':''}`
                   :'not linked to a schedule row',
        `confidence ${d.confidence.toFixed(2)} · found by ${d.source} pass`]}));
  if($('#showItems').checked)
    s.items.forEach(i=>add(i.rect,'item '+catClass(i.category)+(i.needs_review?' rev':''),
      i.mark,{title:`${i.mark} — ${i.category}`,lines:[
        [i.operation,i.leaf_face,i.material].filter(Boolean).join(' · ')||'unresolved',
        (i.width_text&&i.height_text)?`${i.width_text} × ${i.height_text}`:'',
        i.type_text, i.needs_review?'⚑ needs review':'' ].filter(Boolean)}));
}
['showBlocks','showItems','showDet','showLabels'].forEach(id=>
  $('#'+id).onchange=()=>{ if(current!==null) drawBoxes(DATA.sheets[current]); });

function showTip(e,m){
  const t=$('#tip'); t.style.display='block';
  t.innerHTML=`<b>${esc(m.title)}</b>${m.lines.map(l=>`<span class="t">${esc(l)}</span>`).join('')}`;
  const pad=14; let x=e.clientX+pad, y=e.clientY+pad;
  if(x+t.offsetWidth>innerWidth) x=e.clientX-t.offsetWidth-pad;
  if(y+t.offsetHeight>innerHeight) y=e.clientY-t.offsetHeight-pad;
  t.style.left=x+'px'; t.style.top=y+'px';
}
const hideTip=()=>$('#tip').style.display='none';

function setZoom(z){
  zoom=Math.min(4,Math.max(.05,z));
  const st=$('#stage'); if(!st) return;
  st.style.transform=`scale(${zoom})`;
  const s=DATA.sheets[current];
  st.parentElement.style.height=(s.height*zoom)+'px';
  st.parentElement.style.width=(s.width*zoom)+'px';
  $('#zlabel').textContent=Math.round(zoom*100)+'%';
}
function fit(){
  const s=DATA.sheets[current]; if(!s) return;
  setZoom((document.querySelector('main').clientWidth-40)/s.width);
}
$('#zin').onclick=()=>setZoom(zoom*1.25);
$('#zout').onclick=()=>setZoom(zoom/1.25);
$('#zfit').onclick=fit;
addEventListener('resize',()=>{ if(current!==null) fit(); });
</script>
</body>
</html>
